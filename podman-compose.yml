# Podman (rootless) variant of docker-compose.yml.
# Run with: podman compose -f podman-compose.yml up -d --build
# (the built-in `podman compose` is preferred over the standalone Python
# `podman-compose`, which may ignore `depends_on` conditions such as
# service_healthy and service_completed_successfully.)
#
# Status: EXPERIMENTAL - not yet verified on the dev VM, where Docker itself
# cannot run (seccomp blocks setns(2), no CAP_NET_ADMIN; see
# tixwar-infra/DOCKER.md). Intended for machines/VPS where rootless Podman
# is supported; a rootless Podman test on this VM is still in progress.
#
# Deltas vs docker-compose.yml:
# - `promtail` is omitted: it scrapes container logs through
#   /var/run/docker.sock with docker_sd_configs, which do not exist under
#   Podman. Loki still runs and accepts pushes; wire another shipper
#   (e.g. Promtail with static file targets, or journald) if log shipping
#   is needed.
# - `minio` keeps `user: root`: under rootless Podman that is root inside the
#   container's user namespace only, mapped to an unprivileged host UID.
# - All published ports are >= 1025, so rootless port binding works.
# - Networking uses Podman's default rootless stack; no privileged
#   bridge/iptables setup is required.
# Everything else (services, ports, volumes, env, profile `ha`) mirrors
# docker-compose.yml.

name: tixwar

x-api-env: &api-env
  NODE_ENV: development
  PORT: "3000"
  LOG_LEVEL: info
  MONGODB_URI: mongodb://mongos:27017/tixwar?retryWrites=true&w=majority
  MONGODB_DATABASE: tixwar
  MONGODB_READ_PREFERENCE: primary
  REDIS_URL: redis://redis:6379/0
  JWT_ACCESS_SECRET: dev-access-secret-change-me-0123456789
  JWT_REFRESH_SECRET: dev-refresh-secret-change-me-0123456789
  CORS_ORIGINS: http://localhost:8080,http://localhost:3000
  GATEWAY_URL: http://mock-gateway:4000
  SMTP_URL: smtp://mailpit:1025
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_PUBLIC_ENDPOINT: localhost
  MINIO_PUBLIC_PORT: "9000"
  MINIO_ACCESS_KEY: tixwar
  MINIO_SECRET_KEY: tixwar-minio-secret
  MINIO_BUCKET: tixwar-tickets
  DEBUG_ENABLED: "true"
  DEBUG_ADMIN_TOKEN: dev-debug-admin-token-0123456789
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  TRACE_CHANNEL: trace

x-api-service: &api-service
  build:
    context: .
    target: runtime
  environment: *api-env
  depends_on:
    mongos:
      condition: service_started
    redis:
      condition: service_healthy
    mongo-init:
      condition: service_completed_successfully
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 20s

services:
  mongo-config-1:
    image: mongo:7.0
    command:
      [
        "mongod",
        "--configsvr",
        "--replSet",
        "cfg",
        "--port",
        "27019",
        "--dbpath",
        "/data/db",
        "--bind_ip_all",
      ]
    volumes: [mongo-config-1-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongo-config-2:
    image: mongo:7.0
    command:
      [
        "mongod",
        "--configsvr",
        "--replSet",
        "cfg",
        "--port",
        "27019",
        "--dbpath",
        "/data/db",
        "--bind_ip_all",
      ]
    volumes: [mongo-config-2-data:/data/db]

  mongo-config-3:
    image: mongo:7.0
    command:
      [
        "mongod",
        "--configsvr",
        "--replSet",
        "cfg",
        "--port",
        "27019",
        "--dbpath",
        "/data/db",
        "--bind_ip_all",
      ]
    volumes: [mongo-config-3-data:/data/db]

  mongo-shard-0:
    image: mongo:7.0
    command:
      [
        "mongod",
        "--shardsvr",
        "--replSet",
        "shard0",
        "--port",
        "27018",
        "--dbpath",
        "/data/db",
        "--bind_ip_all",
      ]
    volumes: [mongo-shard-0-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongo-shard-1:
    image: mongo:7.0
    command:
      [
        "mongod",
        "--shardsvr",
        "--replSet",
        "shard1",
        "--port",
        "27018",
        "--dbpath",
        "/data/db",
        "--bind_ip_all",
      ]
    volumes: [mongo-shard-1-data:/data/db]

  mongo-shard-2:
    image: mongo:7.0
    command:
      [
        "mongod",
        "--shardsvr",
        "--replSet",
        "shard2",
        "--port",
        "27018",
        "--dbpath",
        "/data/db",
        "--bind_ip_all",
      ]
    volumes: [mongo-shard-2-data:/data/db]

  mongo-shard-0-ha:
    profiles: ["ha"]
    image: mongo:7.0
    command:
      [
        "mongod",
        "--shardsvr",
        "--replSet",
        "shard0",
        "--port",
        "27018",
        "--dbpath",
        "/data/db",
        "--bind_ip_all",
      ]
    volumes: [mongo-shard-0-ha-data:/data/db]

  mongo-shard-1-ha:
    profiles: ["ha"]
    image: mongo:7.0
    command:
      [
        "mongod",
        "--shardsvr",
        "--replSet",
        "shard1",
        "--port",
        "27018",
        "--dbpath",
        "/data/db",
        "--bind_ip_all",
      ]
    volumes: [mongo-shard-1-ha-data:/data/db]

  mongo-shard-2-ha:
    profiles: ["ha"]
    image: mongo:7.0
    command:
      [
        "mongod",
        "--shardsvr",
        "--replSet",
        "shard2",
        "--port",
        "27018",
        "--dbpath",
        "/data/db",
        "--bind_ip_all",
      ]
    volumes: [mongo-shard-2-ha-data:/data/db]

  mongos:
    image: mongo:7.0
    command:
      [
        "mongos",
        "--configdb",
        "cfg/mongo-config-1:27019,mongo-config-2:27019,mongo-config-3:27019",
        "--port",
        "27017",
        "--bind_ip_all",
      ]
    ports: ["27017:27017"]
    depends_on:
      - mongo-config-1
      - mongo-config-2
      - mongo-config-3
      - mongo-shard-0
      - mongo-shard-1
      - mongo-shard-2
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongo-init:
    image: mongo:7.0
    volumes:
      - ./docker/mongo/init-shard.sh:/scripts/init-shard.sh:ro
    entrypoint: ["bash", "/scripts/init-shard.sh"]
    environment:
      MONGOS_HOST: mongos
      CONFIG_SET: cfg
      SHARDS: shard0,shard1,shard2
      SHARD_DB: tixwar
      HA_MEMBERS: mongo-shard-0-ha,mongo-shard-1-ha,mongo-shard-2-ha
    depends_on:
      mongos:
        condition: service_started
      mongo-shard-0:
        condition: service_started
      mongo-shard-1:
        condition: service_started
      mongo-shard-2:
        condition: service_started
      mongo-config-1:
        condition: service_started
      mongo-config-2:
        condition: service_started
      mongo-config-3:
        condition: service_started
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api-1: *api-service
  api-2: *api-service
  api-3: *api-service

  worker:
    build:
      context: .
      target: runtime
    command: ["bun", "src/worker.ts"]
    environment:
      <<: *api-env
      SERVICE_NAME: tixwar-worker
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  outbox-publisher:
    build:
      context: .
      target: runtime
    command: ["bun", "src/outbox-publisher.ts"]
    environment:
      <<: *api-env
      SERVICE_NAME: tixwar-outbox-publisher
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  mock-gateway:
    build:
      context: .
      target: runtime
    command: ["bun", "src/mock-gateway/server.ts"]
    environment:
      MOCK_GATEWAY_PORT: "4000"
      LOG_LEVEL: info
      SERVICE_NAME: mock-gateway
      NODE_ENV: development
    ports: ["4000:4000"]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8080:80"]
    depends_on:
      - api-1
      - api-2
      - api-3

  minio:
    image: adobe/s3mock:latest
    user: root
    environment:
      COM_ADOBE_TESTING_S3MOCK_HTTP_PORT: "9000"
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: tixwar-tickets
    ports: ["9000:9000"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/tixwar-tickets"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["9093:9093"]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3001:3000"]

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    ports: ["3100:3100"]

  # promtail omitted: needs /var/run/docker.sock (Docker-only).
  # See the header comment and docs/podman.md.

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4318:4318"]

  mongodb-exporter:
    image: percona/mongodb_exporter:0.43.1
    command: ["--mongodb.uri=mongodb://mongos:27017", "--collect-all", "--discovering-mode"]
    depends_on:
      mongos:
        condition: service_started
    ports: ["9216:9216"]

volumes:
  mongo-config-1-data:
  mongo-config-2-data:
  mongo-config-3-data:
  mongo-shard-0-data:
  mongo-shard-1-data:
  mongo-shard-2-data:
  mongo-shard-0-ha-data:
  mongo-shard-1-ha-data:
  mongo-shard-2-ha-data:
  redis-data:
  minio-data:
  grafana-data:
