global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api-1:3000", "api-2:3000", "api-3:3000"]
        labels:
          service: tixwar-api

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9464"]
        labels:
          service: tixwar-worker

  - job_name: outbox-publisher
    metrics_path: /metrics
    static_configs:
      - targets: ["outbox-publisher:9464"]
        labels:
          service: tixwar-outbox-publisher

  - job_name: mongodb
    static_configs:
      - targets: ["mongodb-exporter:9216"]
        labels:
          service: mongodb

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
