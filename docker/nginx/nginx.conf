worker_processes auto;

events {
  worker_connections 8192;
}

http {
  include /etc/nginx/mime.types;
  default_type application/json;

  log_format json_combined escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"request_time":$request_time,'
    '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time",'
    '"request_id":"$http_x_request_id"}';

  access_log /var/log/nginx/access.log json_combined;

  limit_req_zone $binary_remote_addr zone=coarse_api:10m rate=600r/m;
  limit_req_zone $binary_remote_addr zone=coarse_order:10m rate=60r/m;
  limit_req_status 429;

  upstream tixwar_api {
    least_conn;
    server api-1:3000 max_fails=3 fail_timeout=10s;
    server api-2:3000 max_fails=3 fail_timeout=10s;
    server api-3:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;

  server {
    listen 80;
    server_name _;
    client_max_body_size 200k;

    location = /nginx-health {
      access_log off;
      return 200 '{"status":"ok"}';
    }

    location ~ ^/v1/orders/?$ {
      limit_req zone=coarse_order burst=20 nodelay;
      proxy_read_timeout 30s;
      proxy_pass http://tixwar_api;
    }

    location ~ /stream$ {
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_set_header Connection "";
      proxy_pass http://tixwar_api;
    }

    location / {
      limit_req zone=coarse_api burst=100 nodelay;
      proxy_read_timeout 30s;
      proxy_pass http://tixwar_api;
    }
  }
}
