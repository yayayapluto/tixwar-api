name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Biome, TypeScript, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bunx biome check .

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test tests/unit

  integration:
    name: Integration tests (sharded cluster + Redis)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start sharded MongoDB cluster, Redis and Mailpit
        run: |
          docker compose up -d \
            mongo-config-1 mongo-config-2 mongo-config-3 \
            mongo-shard-0 mongo-shard-1 mongo-shard-2 \
            mongos mongo-init redis mailpit

      - name: Wait for shards to be registered
        run: |
          for i in $(seq 1 90); do
            SHARDS=$(docker compose exec -T mongos mongosh --quiet --eval \
              "db.adminCommand({listShards:1}).shards.length" 2>/dev/null | tr -d '\r' | tail -1)
            echo "attempt $i: shards=${SHARDS:-none}"
            if [ "$SHARDS" = "3" ]; then
              echo "sharded cluster ready"
              break
            fi
            sleep 2
          done
          test "$SHARDS" = "3" || { echo "shards not registered"; docker compose logs --no-color mongo-init; exit 1; }
          docker compose exec -T redis redis-cli ping

      - name: Start mock payment gateway
        run: |
          bun run src/mock-gateway/server.ts > /tmp/mock-gateway.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health > /dev/null 2>&1; then
              echo "mock gateway ready"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:4000/health

      - name: Integration tests
        env:
          MONGODB_URI: mongodb://localhost:27017/tixwar_test?retryWrites=true&w=majority
          REDIS_URL: redis://localhost:6379/1
          GATEWAY_URL: http://localhost:4000
          SMTP_URL: smtp://localhost:1025
        run: bun test tests/integration

      - name: Compose logs on failure
        if: failure()
        run: |
          docker compose logs --no-color mongo-init mongos redis mailpit | tail -120
          cat /tmp/mock-gateway.log 2>/dev/null | tail -40

  build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose build
